<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1GA PASS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Модальное окно регистрации */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #2a3555 0%, #1f2744 100%);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .modal-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-text {
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(255,255,255,0.15);
        }

        .input-error {
            border-color: #ff4444;
        }

        .error-text {
            color: #ff4444;
            font-size: 14px;
            margin-top: 8px;
            text-align: left;
        }

        /* Меню */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: #1a1f3a;
            z-index: 1000;
            transition: left 0.3s;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .menu-overlay.active {
            left: 0;
        }

        .menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .menu-backdrop.active {
            display: block;
        }

        .menu-close {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .menu-item.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .menu-item-icon {
            font-size: 24px;
        }

        .menu-item-text {
            font-size: 16px;
            font-weight: 500;
        }

        /* Контейнер */
        .app-container {
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .burger-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logo span {
            background: #00ff88;
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            margin-left: 5px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        /* Страницы */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Профиль */
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-id {
            color: #00ff88;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .balance-card {
            background: linear-gradient(135deg, #2a3555 0%, #1f2744 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        .balance-label {
            color: #00ff88;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #2a3555 0%, #1f2744 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        /* Задания */
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .tab.active {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
        }

        .task-card {
            background: linear-gradient(135deg, #2a3555 0%, #1f2744 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .task-card:active {
            transform: scale(0.98);
        }

        .task-image {
            width: 100%;
            height: 180px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 60px;
            position: relative;
        }

        .task-image .reward-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .task-reward {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 255, 136, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .task-status {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .task-status.completed {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .task-status.checking {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
        }

        .task-status.pending {
            background: rgba(100, 100, 255, 0.2);
            color: #6464ff;
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            margin: 10px 0;
        }

        .task-description {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #00ff88;
            color: #000;
        }

        .btn-secondary {
            background: rgba(100, 100, 255, 0.3);
            color: #fff;
        }

        .btn-warning {
            background: rgba(255, 165, 0, 0.3);
            color: #fff;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #666;
            cursor: not-allowed;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #2a3555 0%, #1f2744 100%);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 2000;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Модальное окно регистрации -->
    <div class="modal" id="registrationModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">👋</div>
            <div class="modal-title">Добро пожаловать!</div>
            <div class="modal-text">Придумай свой уникальный никнейм</div>
            
            <div class="input-group">
                <label class="input-label">Никнейм</label>
                <input type="text" class="input" id="nicknameInput" placeholder="Введи ник" maxlength="20">
                <div class="error-text" id="nicknameError" style="display: none;"></div>
            </div>
            
            <button class="btn btn-primary" onclick="createProfile()">Создать профиль</button>
        </div>
    </div>

    <!-- Меню -->
    <div class="menu-backdrop" id="menuBackdrop" onclick="closeMenu()"></div>
    <div class="menu-overlay" id="menuOverlay">
        <button class="menu-close" onclick="closeMenu()">✕</button>
        
        <div class="menu-items">
            <div class="menu-item active" data-page="tasks">
                <span class="menu-item-icon">🎮</span>
                <span class="menu-item-text">Задания</span>
            </div>
            <div class="menu-item" data-page="profile">
                <span class="menu-item-icon">👤</span>
                <span class="menu-item-text">Профиль</span>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div class="notification" id="notification">
        <span class="notification-icon">✅</span>
        <span id="notificationText"></span>
    </div>

    <!-- Контейнер -->
    <div class="app-container">
        <div class="header">
            <button class="burger-btn" onclick="openMenu()">☰</button>
            <div class="logo">L1GA<span>PASS</span></div>
            <div class="user-avatar" onclick="showPage('profile')">
                <span id="userAvatarIcon">👤</span>
            </div>
        </div>

        <!-- Страница: Профиль -->
        <div class="page" id="page-profile">
            <div class="profile-header">
                <div class="profile-avatar">
                    <span id="profileAvatarIcon">👤</span>
                </div>
                <div class="profile-id" id="profileId">#12345678</div>
                <div class="profile-name" id="profileName">Loading...</div>
            </div>

            <div class="balance-card">
                <div class="balance-label">LIGA COIN</div>
                <div class="balance-amount">
                    💰 <span id="profileBalance">0</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Завершено заданий</div>
                    <div class="stat-value" id="statCompleted">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">На проверке</div>
                    <div class="stat-value" id="statChecking">0</div>
                </div>
            </div>
        </div>

        <!-- Страница: Задания -->
        <div class="page active" id="page-tasks">
            <h1>Задания</h1>

            <div class="tabs">
                <button class="tab active" data-category="all">Все</button>
                <button class="tab" data-category="CS2">CS2</button>
                <button class="tab" data-category="Dota 2">Dota 2</button>
                <button class="tab" data-category="Социальные">Социальные</button>
            </div>

            <div id="tasks-container">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Загрузка заданий...
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#1a1f3a');
        tg.setBackgroundColor('#1a1f3a');

        const API_URL = 'http://localhost:3000/api';
        
        let userData = null;
        let allTasks = [];
        let currentCategory = 'all';
        let telegramId = null;

        // Меню
        function openMenu() {
            document.getElementById('menuOverlay').classList.add('active');
            document.getElementById('menuBackdrop').classList.add('active');
        }

        function closeMenu() {
            document.getElementById('menuOverlay').classList.remove('active');
            document.getElementById('menuBackdrop').classList.remove('active');
        }

        // Переключение страниц
        function showPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageName}`).classList.add('active');
            
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.querySelector(`[data-page="${pageName}"]`)?.classList.add('active');
            
            closeMenu();
            
            if (pageName === 'profile') {
                updateProfile();
            }
        }

        // Уведомления
        function showNotification(text, icon = '✅') {
            const notification = document.getElementById('notification');
            notification.querySelector('.notification-icon').textContent = icon;
            document.getElementById('notificationText').textContent = text;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Регистрация
        async function createProfile() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const errorEl = document.getElementById('nicknameError');
            const inputEl = document.getElementById('nicknameInput');
            
            if (!nickname) {
                errorEl.textContent = 'Введи никнейм';
                errorEl.style.display = 'block';
                inputEl.classList.add('input-error');
                return;
            }
            
            if (nickname.length < 3) {
                errorEl.textContent = 'Минимум 3 символа';
                errorEl.style.display = 'block';
                inputEl.classList.add('input-error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/user/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, nickname })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('registrationModal').style.display = 'none';
                    await init();
                    showNotification('Профиль создан! 🎉');
                } else {
                    errorEl.textContent = result.error;
                    errorEl.style.display = 'block';
                    inputEl.classList.add('input-error');
                }
            } catch (err) {
                errorEl.textContent = 'Ошибка сервера';
                errorEl.style.display = 'block';
                inputEl.classList.add('input-error');
            }
        }

        // Загрузка данных пользователя
        async function loadUserData() {
            try {
                const response = await fetch(`${API_URL}/user/${telegramId}`);
                const data = await response.json();
                
                if (!data.exists) {
                    document.getElementById('registrationModal').style.display = 'flex';
                    return false;
                }
                
                userData = data.user;
                updateProfile();
                return true;
            } catch (err) {
                console.error('Ошибка загрузки пользователя:', err);
                return false;
            }
        }

        function updateProfile() {
            if (!userData) return;
            
            document.getElementById('profileName').textContent = userData.nickname;
            document.getElementById('profileId').textContent = `#${userData.telegram_id}`;
            document.getElementById('profileBalance').textContent = userData.balance;
            document.getElementById('statCompleted').textContent = userData.completedTasks || 0;
            
            const checking = allTasks.filter(t => t.user_status === 'checking').length;
            document.getElementById('statChecking').textContent = checking;
        }

        // Загрузка заданий
        async function loadTasks() {
            try {
                const response = await fetch(`${API_URL}/tasks/${telegramId}`);
                const data = await response.json();
                allTasks = data.tasks;
                renderTasks();
            } catch (err) {
                console.error('Ошибка загрузки заданий:', err);
            }
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            
            const filteredTasks = currentCategory === 'all' 
                ? allTasks 
                : allTasks.filter(t => t.category === currentCategory);
            
            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #aaa;">
                        <div style="font-size: 80px; margin-bottom: 20px;">📋</div>
                        <div>Нет заданий в этой категории</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredTasks.map(task => {
                const status = task.user_status || 'new';
                
                let statusBadge = '';
                let buttonHtml = '';
                
                if (status === 'completed') {
                    statusBadge = '<div class="task-status completed">✅ Выполнено</div>';
                    buttonHtml = '<button class="btn btn-disabled">✅ Выполнено</button>';
                } else if (status === 'checking') {
                    statusBadge = '<div class="task-status checking">⏳ На проверке</div>';
                    buttonHtml = '<button class="btn btn-warning">⏳ Ожидает проверки</button>';
                } else if (status === 'pending') {
                    statusBadge = '<div class="task-status pending">📝 Принято</div>';
                    buttonHtml = `<button class="btn btn-secondary" onclick="submitTask('${task.id}')">📤 Отправить на проверку</button>`;
                } else {
                    buttonHtml = `<button class="btn btn-primary" onclick="acceptTask('${task.id}')">✅ Принять задание</button>`;
                }
                
                return `
                    <div class="task-card">
                        <div class="task-image">
                            <div class="reward-badge">💰 ${task.reward}</div>
                            <span style="font-size: 80px">${task.icon}</span>
                        </div>
                        
                        <div class="task-info">
                            <div class="task-reward">💰 ${task.reward}</div>
                            ${statusBadge}
                        </div>
                        
                        <div class="task-title">${task.title}</div>
                        <div class="task-description">${task.description}</div>
                        
                        ${buttonHtml}
                    </div>
                `;
            }).join('');
        }

        async function acceptTask(taskId) {
            try {
                const response = await fetch(`${API_URL}/task/accept`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, taskId })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    await loadTasks();
                    showNotification('Задание принято! Выполни его и отправь на проверку', '📝');
                } else {
                    showNotification(result.error, '❌');
                }
            } catch (err) {
                showNotification('Ошибка сервера', '❌');
            }
        }

        async function submitTask(taskId) {
            try {
                const response = await fetch(`${API_URL}/task/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, taskId })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    await loadTasks();
                    showNotification('Задание отправлено на проверку! ⏳', '📤');
                } else {
                    showNotification(result.error, '❌');
                }
            } catch (err) {
                showNotification('Ошибка сервера', '❌');
            }
        }

        // Табы
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                renderTasks();
            });
        });

        // Меню навигация
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                showPage(item.dataset.page);
            });
        });

        // Инициализация
        async function init() {
            const user = tg.initDataUnsafe?.user;
            
            if (user) {
                telegramId = user.id;
                const emoji = user.first_name?.[0] || '👤';
                document.getElementById('userAvatarIcon').textContent = emoji;
                document.getElementById('profileAvatarIcon').textContent = emoji;
                
                const userLoaded = await loadUserData();
                if (userLoaded) {
                    await loadTasks();
                }
